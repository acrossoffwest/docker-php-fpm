name: PHP base image

on:
  push:
    tags:
      - 'php-base-*'

env:
  UPSTREAM_SHA: e3eaff845f7a9f7259c31da54dce0320b47a3bbd
  UPSTREAM_DIR: 8.2/alpine3.23/fpm
  IMAGE: acrossoffwest/php:8.2.35-fpm-alpine3.23

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch upstream recipe
        run: |
          git init upstream
          git -C upstream fetch --depth 1 https://github.com/docker-library/php.git "$UPSTREAM_SHA"
          git -C upstream checkout FETCH_HEAD
      - uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: upstream/${{ env.UPSTREAM_DIR }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
